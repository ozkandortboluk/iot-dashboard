<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="nnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Outer Hexagon Mesh -->
  <polygon
    points="32,9 51,20 51,44 32,55 13,44 13,20"
    fill="none"
    stroke="url(#nnGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <!-- Connecting circuit lines -->
  <line x1="32" y1="32" x2="32" y2="9" stroke="#38bdf8" stroke-width="1.75" stroke-dasharray="2 2" />
  <line x1="32" y1="32" x2="51" y2="20" stroke="#818cf8" stroke-width="1.75" />
  <line x1="32" y1="32" x2="51" y2="44" stroke="#34d399" stroke-width="1.75" />
  <line x1="32" y1="32" x2="32" y2="55" stroke="#06b6d4" stroke-width="1.75" stroke-dasharray="2 2" />
  <line x1="32" y1="32" x2="13" y2="44" stroke="#818cf8" stroke-width="1.75" />
  <line x1="32" y1="32" x2="13" y2="20" stroke="#34d399" stroke-width="1.75" />
  <!-- Peripheral Nodes -->
  <circle cx="32" cy="9" r="3.5" fill="#06b6d4" />
  <circle cx="51" cy="20" r="3.5" fill="#6366f1" />
  <circle cx="51" cy="44" r="3.5" fill="#10b981" />
  <circle cx="32" cy="55" r="3.5" fill="#06b6d4" />
  <circle cx="13" cy="44" r="3.5" fill="#6366f1" />
  <circle cx="13" cy="20" r="3.5" fill="#10b981" />
  <!-- Central Core Pulse Orb -->
  <circle cx="32" cy="32" r="8" fill="url(#nnGrad)" />
  <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
</svg>
