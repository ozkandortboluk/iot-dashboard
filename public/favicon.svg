<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes pulseRing {
        0% { r: 12px; opacity: 0.8; }
        50% { r: 24px; opacity: 0.2; }
        100% { r: 28px; opacity: 0; }
      }
      @keyframes nodeGlow {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .pulse-circle {
        transform-origin: center;
        animation: pulseRing 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .pulse-circle-2 {
        transform-origin: center;
        animation: pulseRing 2.4s cubic-bezier(0.215, 0.61, 0.355, 1) 1.2s infinite;
      }
      .center-core {
        transform-origin: 32px 32px;
        animation: nodeGlow 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background rounded plate -->
  <rect width="64" height="64" rx="14" fill="#090d16" />
  <rect width="64" height="64" rx="14" stroke="url(#nexusGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Radiating Pulse Rings -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#06b6d4" stroke-width="1.5" class="pulse-circle" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="#6366f1" stroke-width="1.2" class="pulse-circle-2" />

  <!-- Outer Hexagon Circuit Mesh -->
  <polygon points="32,8 52,19.5 52,42.5 32,54 12,42.5 12,19.5" fill="none" stroke="url(#nexusGrad)" stroke-width="1.8" stroke-linejoin="round" opacity="0.85" />

  <!-- Node Connection Vectors -->
  <line x1="32" y1="32" x2="32" y2="8" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
  <line x1="32" y1="32" x2="52" y2="19.5" stroke="#818cf8" stroke-width="1.5" opacity="0.8" />
  <line x1="32" y1="32" x2="52" y2="42.5" stroke="#34d399" stroke-width="1.5" opacity="0.8" />
  <line x1="32" y1="32" x2="32" y2="54" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
  <line x1="32" y1="32" x2="12" y2="42.5" stroke="#818cf8" stroke-width="1.5" opacity="0.8" />
  <line x1="32" y1="32" x2="12" y2="19.5" stroke="#34d399" stroke-width="1.5" opacity="0.8" />

  <!-- Peripheral IoT Nodes -->
  <circle cx="32" cy="8" r="3.2" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="52" cy="19.5" r="3.2" fill="#6366f1" filter="url(#glow)" />
  <circle cx="52" cy="42.5" r="3.2" fill="#10b981" filter="url(#glow)" />
  <circle cx="32" cy="54" r="3.2" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="12" cy="42.5" r="3.2" fill="#6366f1" filter="url(#glow)" />
  <circle cx="12" cy="19.5" r="3.2" fill="#10b981" filter="url(#glow)" />

  <!-- Central Nexus Core -->
  <g class="center-core">
    <circle cx="32" cy="32" r="7" fill="url(#nexusGrad)" filter="url(#glow)" />
    <circle cx="32" cy="32" r="3" fill="#ffffff" />
  </g>
</svg>
