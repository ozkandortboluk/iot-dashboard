user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Maximum upload payload size (critical for OTA binary uploads and bulk telemetry batches)
    client_max_body_size 50M;

    # Gzip Compression for REST responses and frontend assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Restrict burst traffic before reaching the application.
    limit_req_zone $binary_remote_addr zone=nexus_api:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=nexus_conn:10m;
    limit_req_status 429;

    # WebSocket Connection Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Node.js Application Cluster
    upstream nexus_backend {
        server app:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Healthcheck probe endpoint for container orchestrators (k8s / docker swarm / alb)
        location /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK
";
        }

        # ACME Challenge for Let's Encrypt / Certbot automated renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Block sensitive dotfiles and common configuration probes before SPA fallback.
        # ACME challenges remain accessible through the dedicated location above.
        location ~ (^|/)\.(?!well-known(?:/|$)) {
            return 404;
        }

        location ~* ^/(?:wp-config\.php|xmlrpc\.php|wp-includes|wp-admin|wp-content|composer\.(?:json|lock)|package(?:-lock)?\.json|docker-compose\.ya?ml) {
            return 404;
        }

        # WebSocket Reverse Proxy Routing (Dedicated IoT Telemetry & UI Real-time Channels)
        location ~ ^/(?:ws|api/ws)$ {
            limit_req zone=nexus_api burst=30 nodelay;
            limit_conn nexus_conn 30;
            proxy_pass http://nexus_backend;
            proxy_http_version 1.1;

            # HTTP Upgrade headers for persistent WebSocket duplex channels
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Real client IP and proxy chain preservation
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for persistent long-lived IoT heartbeats & telemetry streaming
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;

            # Disable buffering to guarantee instantaneous bi-directional packet relay
            proxy_buffering off;
        }

        # General REST API, OTA Downloads, Static Assets and Single Page Application (SPA)
        location / {
            limit_req zone=nexus_api burst=80 nodelay;
            limit_conn nexus_conn 60;
            proxy_pass http://nexus_backend;
            proxy_http_version 1.1;

            # Pass Host and client IP headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection "";

            # Standard HTTP timeouts
            proxy_connect_timeout 15s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings for HTTP traffic
            proxy_buffers 16 32k;
            proxy_buffer_size 64k;
            proxy_busy_buffers_size 128k;
        }
    }
}
