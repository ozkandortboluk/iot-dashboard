services:
  timescaledb:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: nexus_timescaledb
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the VPS .env file}
      POSTGRES_DB: ${POSTGRES_DB:-iot_dashboard}
    ports:
      - "${POSTGRES_PORT_BIND:-127.0.0.1:5432:5432}"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nexus_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: iot-dashboard-app
    container_name: nexus_app
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "${PORT_BIND:-127.0.0.1:3000:3000}"
    environment:
      NODE_ENV: production
      SERVER_PORT: 3000
      APP_URL: ${APP_URL:-https://www.nexusnodeiot.com.tr}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-timescaledb}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-iot_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the VPS .env file}
      DB_NAME: ${POSTGRES_DB:-iot_dashboard}
      POSTGRES_HOST: ${DB_HOST:-timescaledb}
      POSTGRES_PORT: ${DB_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the VPS .env file}
      POSTGRES_DB: ${POSTGRES_DB:-iot_dashboard}
      SETUP_REQUIRED: ${SETUP_REQUIRED:-true}
      ENABLE_SIMULATOR: ${ENABLE_SIMULATOR:-false}
      ENABLE_TEST_ACCOUNT: ${ENABLE_TEST_ACCOUNT:-false}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nexus_net

  adminer:
    image: adminer:latest
    container_name: nexus_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: timescaledb
    ports:
      - "${ADMINER_PORT_BIND:-127.0.0.1:8080:8080}"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - nexus_net

  proxy:
    image: nginx:alpine
    container_name: nexus_proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      adminer:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${ADMINER_HTPASSWD_PATH:-/etc/nexusnode/adminer.htpasswd}:/etc/nginx/adminer.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nexus_net

volumes:
  timescaledb_data:
  app_data:

networks:
  nexus_net:
    driver: bridge
