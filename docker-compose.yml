services:
  timescaledb:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: nexus_timescaledb
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_iot_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-iot_dashboard}
    # Security: In production, database is isolated inside nexus_net.
    # To expose port locally for external tools, set POSTGRES_PORT_BIND=127.0.0.1:5432:5432 in .env
    ports:
      - "${POSTGRES_PORT_BIND:-127.0.0.1:5432:5432}"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_dashboard}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nexus_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: iot-dashboard-app
    container_name: nexus_app
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_started
    ports:
      - "${PORT_BIND:-3000:3000}"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Auto-resolves to timescaledb service inside docker network with fallback credentials
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-iot_user}:${POSTGRES_PASSWORD:-nexus_iot_secure_pass_2026}@timescaledb:5432/${POSTGRES_DB:-iot_dashboard}?sslmode=disable}
      DB_HOST: ${DB_HOST:-timescaledb}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-iot_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexus_iot_secure_pass_2026}
      DB_NAME: ${POSTGRES_DB:-iot_dashboard}
      POSTGRES_HOST: ${DB_HOST:-timescaledb}
      POSTGRES_PORT: ${DB_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_iot_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-iot_dashboard}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - nexus_net

  proxy:
    image: nginx:alpine
    container_name: nexus_proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexus_net

  adminer:
    image: adminer:latest
    container_name: nexus_adminer
    restart: unless-stopped
    # Security: Restrict Adminer to localhost interface only to prevent public web exposure
    ports:
      - "${ADMINER_PORT_BIND:-127.0.0.1:8080:8080}"
    networks:
      - nexus_net
    depends_on:
      - timescaledb

volumes:
  timescaledb_data:
  app_data:

networks:
  nexus_net:
    driver: bridge