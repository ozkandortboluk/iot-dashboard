services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: nexus_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: kastamonuaraccalalibeyli.37
      POSTGRES_DB: iot_dashboard
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d iot_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nexus_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: iot-dashboard-app
    container_name: nexus_app
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USER: iot_user
      DB_PASSWORD: kastamonuaraccalalibeyli.37
      DB_NAME: iot_dashboard
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexus_net

  proxy:
    image: nginx:alpine
    container_name: nexus_proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexus_net

  adminer:
    image: adminer:latest
    container_name: nexus_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - nexus_net
    depends_on:
      - timescaledb

volumes:
  timescaledb_data:
  app_data:

networks:
  nexus_net:
    driver: bridge