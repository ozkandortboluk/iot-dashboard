version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: nexus_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kastamonuaraccalalibeyli.37}
      POSTGRES_DB: ${POSTGRES_DB:-iot_dashboard}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_app
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot_user}:${POSTGRES_PASSWORD:-kastamonuaraccalalibeyli.37}@timescaledb:5432/${POSTGRES_DB:-iot_dashboard}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-nexus_super_secret_jwt_key_2026}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexus_net

  proxy:
    image: nginx:alpine
    container_name: nexus_proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexus_net

volumes:
  timescaledb_data:
  app_data:

networks:
  nexus_net:
    driver: bridge
