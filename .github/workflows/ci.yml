name: Continuous Integration & Test Pipeline

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, Test, Smoke & Build Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:2.14.2-pg16
        env:
          POSTGRES_DB: iot_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/iot_test_db
      PORT: 3000

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Generate Dynamic Runtime Test Vault Key (RUN-01)
        run: echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Setup Node.js Environment (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Lint Codebase (ESLint)
        run: npm run lint

      - name: Run Automated Test Suite (Vitest)
        run: npm test

      - name: Build Production Bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Production Bundle Smoke Test
        run: npm run test:smoke

      - name: Run End-to-End Security & Protocol Suite
        run: npm run test:e2e

      - name: Archive Test & Server Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-logs-node-${{ matrix.node-version }}
          path: |
            data/
            dist/
            *.log
          retention-days: 7
