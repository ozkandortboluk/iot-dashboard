name: Continuous Integration & Test Pipeline

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, Test, Smoke & Build Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:2.14.2-pg16
        env:
          POSTGRES_DB: iot_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20.x, 22.x ]

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/iot_test_db
      PORT: 3000

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Generate Dynamic Runtime Test Vault Key (RUN-01)
        run: echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Setup Node.js Environment (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Lint Codebase (ESLint)
        run: npm run lint

      - name: Run Automated Test Suite (Vitest)
        run: npm test -- --exclude src/tests/docker_secret_ownership_postgres_auth.test.ts

      - name: Build Production Bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Production Bundle Smoke Test
        run: npm run test:smoke

      - name: Run End-to-End Security & Protocol Suite
        run: npm run test:e2e

      - name: Archive Sanitized Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-reports-node-${{ matrix.node-version }}
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  privileged-secret-ownership:
    name: Privileged Secret Ownership Integration (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
      - name: Run UID/GID and ACL integration tests in isolated root container
        run: |
          docker run --rm --user 0:0 \
            -v "$PWD:/source:ro" \
            -w /tmp/project \
            node:22-bookworm-slim \
            bash -ec '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends acl openssl ca-certificates >/dev/null
              cp -a /source /tmp/project
              cd /tmp/project
              useradd -u 1001 -m deploy
              npm ci --ignore-scripts
              npx vitest run src/tests/docker_secret_ownership_postgres_auth.test.ts
            '
