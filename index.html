<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusNode IoT | Endüstriyel Saha & IoT Platformu (nexusnodeiot.com.tr)</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="description" content="NexusNode IoT (nexusnodeiot.com.tr) - Endüstriyel Gerçek Zamanlı Telemetri, Saha Cihaz Yönetimi ve OTA Platformu" />
    <meta name="theme-color" content="#4f46e5" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=()" />
    <script>
      (function() {
        try {
          if (navigator && navigator.mediaDevices) {
            navigator.mediaDevices.getUserMedia = function() {
              return Promise.reject(new DOMException('Kamera kullanımı engellendi', 'NotAllowedError'));
            };
          }
          if (navigator && navigator.permissions && navigator.permissions.query) {
            var orig = navigator.permissions.query.bind(navigator.permissions);
            navigator.permissions.query = function(p) {
              if (p && (p.name === 'camera' || p.name === 'microphone')) {
                return Promise.resolve({ state: 'denied', name: p.name });
              }
              return orig(p);
            };
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
