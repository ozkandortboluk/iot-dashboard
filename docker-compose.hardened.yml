# Opt-in hardening overlay. Validate on staging before enabling.
# Usage: docker compose -f docker-compose.yml -f docker-compose.hardened.yml config
# Deploy only after testing: docker compose -f docker-compose.yml -f docker-compose.hardened.yml up -d
services:
  app:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  adminer:
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  timescaledb:
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
